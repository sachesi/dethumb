name: Release

# A release tag gets a GitHub release, once CI has passed (ci.yml calls this). The tag
# must agree with the version in the sources; the notes list the fixes and features
# committed since the previous tag. The release carries the crates the build needs, for
# building without a network, and packages for Fedora, Debian, Ubuntu and Arch Linux. Once
# published, it is built in Copr, in sachesi/software. Run by hand, it publishes a tag
# pushed before this workflow existed.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v1.2.3
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    name: Check the version and vendor the crates
    runs-on: ubuntu-latest
    env:
      NAME: dethumb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # The notes need the history back to the previous tag.
          fetch-depth: 0
      - name: Check the version and write the notes
        run: |
          mkdir -p notes
          python3 - <<'EOF'
          import os, re, subprocess, sys, tomllib

          def toml(path, *keys):
              with open(path, "rb") as f:
                  value = tomllib.load(f)
              for key in keys:
                  value = value[key]
              return path, value

          def lock(path, name):
              with open(path, "rb") as f:
                  found = [p["version"] for p in tomllib.load(f)["package"] if p["name"] == name]
              return f"{name} in {path}", found[0]

          tag = os.environ["TAG"].removeprefix("v")
          found = [
              toml("Cargo.toml", "package", "version"),
              lock("Cargo.lock", "dethumb"),
          ]
          wrong = [f"{where} says {v}" for where, v in found if v != tag]
          if wrong:
              sys.exit(f"The tag is {tag}, but " + ", ".join(wrong))

          def git(*args):
              return subprocess.run(["git", *args], capture_output=True, text=True).stdout.strip()

          previous = git("describe", "--tags", "--abbrev=0", os.environ["TAG"] + "^")
          span = f"{previous}..{os.environ['TAG']}" if previous else os.environ["TAG"]
          subjects = git("log", "--no-merges", "--format=%s", span).splitlines()
          picked = [s for s in subjects if re.match(r"(feat|fix|perf)(\(.*\))?!?:", s)] or [
              s for s in subjects if not re.match(r"(chore|ci)(\(.*\))?!?:", s)
          ]
          notes = ["\n".join(f"- {s}" for s in picked)]
          with open("notes/notes.md", "w") as f:
              f.write("\n\n".join(notes) + "\n")
          EOF
      - name: Vendor the crates
        run: |
          dir="$NAME-${TAG#v}"
          mkdir -p "$dir/.cargo" dist
          cargo vendor --locked --versioned-dirs "$dir/vendor" > "$dir/.cargo/config.toml"
          # Paths relative to the source tree, so the tarball unpacks over it.
          sed -i 's|^directory = .*|directory = "vendor"|' "$dir/.cargo/config.toml"
          tar --sort=name --mtime="@$(git log -1 --format=%ct)" --owner=0 --group=0 --numeric-owner \
            -cJf "dist/$dir-vendor.tar.xz" "$dir"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notes
          path: notes/notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vendor
          path: dist/*

  fedora:
    name: Package for Fedora
    needs: source
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install the tools
        run: dnf install -y --setopt=install_weak_deps=False git-core rpm-build dnf-plugins-core
      # The spec of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The spec's Source1, which the release is not yet there to serve.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vendor
          path: rpmbuild/SOURCES
      - name: Build
        run: |
          spec=packaging/fedora/dethumb.spec
          sed -i "s/^Version:.*/Version:        ${TAG#v}/; s/^Release:.*/Release:        1%{?dist}/" "$spec"
          dnf builddep -y --setopt=install_weak_deps=False "$spec"
          # rpmbuild fetches Source0 from the tag into a directory it does not create itself.
          mkdir -p rpmbuild/SOURCES
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" --define "_disable_source_fetch 0" "$spec"
          mkdir dist && mv rpmbuild/RPMS/*/*.rpm dist/
          # The dependencies resolve on the release it was built for.
          dnf install -y dist/*.rpm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora
          path: dist/*

  debian:
    name: Package for ${{ matrix.name }}
    needs: source
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Testing, as for the GTK applications.
          - name: Debian
            image: debian:forky
            artifact: debian
            revision: "1"
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            artifact: ubuntu
            revision: 1~ubuntu26.04
    container: ${{ matrix.image }}
    env:
      REVISION: ${{ matrix.revision }}
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        # Not the image's sh, which is dash.
        shell: bash
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev \
            cargo rustc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - name: Build
        run: |
          cargo build --locked --release
          install -Dm755 target/release/dethumb -t stage/usr/bin
          install -Dm644 packaging/usr/share/thumbnailers/dethumb.thumbnailer -t stage/usr/share/thumbnailers
          install -Dm644 LICENSE stage/usr/share/doc/dethumb/copyright
      - name: Package
        run: |
          bins=()
          for f in $(find stage -type f); do
            readelf -h "$f" >/dev/null 2>&1 && bins+=("$f")
          done
          arch=all shlibs=
          if [ ${#bins[@]} -gt 0 ]; then
            arch=$(dpkg --print-architecture)
            strip --strip-unneeded "${bins[@]}"
            # dpkg-shlibdeps wants a source package to belong to.
            mkdir debian
            printf 'Source: dethumb\n\nPackage: dethumb\nArchitecture: any\n' > debian/control
            shlibs=$(dpkg-shlibdeps -O $(printf -- '-e %s ' "${bins[@]}") | sed -n 's/^shlibs:Depends=//p')
          fi
          mkdir stage/DEBIAN
          cat > stage/DEBIAN/control <<EOF
          Package: dethumb
          Version: ${TAG#v}-$REVISION
          Architecture: $arch
          Maintainer: sachesi <xsachesi@pm.me>
          Installed-Size: $(du -sk stage | cut -f1)
          Depends: $shlibs
          Section: graphics
          Priority: optional
          Homepage: https://github.com/sachesi/dethumb
          Description: Thumbnailer for Linux .desktop files and Windows .exe binaries
           dethumb generates PNG thumbnails for Linux .desktop files and Windows .exe
           binaries, integrating with file managers via the freedesktop thumbnailer
           protocol. Desktop entries are rendered from their Icon= entry using the system
           icon theme; executables have their embedded icon extracted from PE resources.
          EOF
          mkdir dist
          deb="dist/dethumb_${TAG#v}-${REVISION}_$arch.deb"
          dpkg-deb --root-owner-group -Zxz --build stage "$deb"
          # The dependencies resolve on the release it was built for.
          apt-get install -y "./$deb"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  arch:
    name: Package for Arch Linux
    needs: source
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The PKGBUILD of this workflow's revision, which builds the tag's sources.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          pacman -Syu --noconfirm --needed git
          useradd -m builder
          install -d -o builder pkg
          cp packaging/aur/PKGBUILD pkg/
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" pkg/PKGBUILD
          (source pkg/PKGBUILD && pacman -S --noconfirm --needed --asdeps "${depends[@]}" "${makedepends[@]}")
          su builder -c 'cd pkg && makepkg --noconfirm'
          name=$(source pkg/PKGBUILD && echo "$pkgname")
          mkdir dist && mv pkg/"$name-${TAG#v}"-1-*.pkg.tar.zst dist/
          # The dependencies resolve on Arch as it is today.
          pacman -U --noconfirm dist/*.pkg.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: dist/*

  publish:
    name: Publish the release
    needs: [source, fedora, debian, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: notes
          name: notes
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: "{vendor,fedora,debian,ubuntu,arch}"
          merge-multiple: true
      - name: Publish
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          # A release that already exists keeps its notes, which may have been edited by hand.
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber *
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --title "dethumb ${TAG#v}" \
              --notes-file ../notes/notes.md *
          fi

  copr:
    name: Build in Copr
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Start the build
        env:
          # The custom webhook of sachesi/software, without the package name.
          COPR_WEBHOOK: ${{ secrets.COPR_WEBHOOK }}
        run: |
          [ -n "$COPR_WEBHOOK" ] || { echo "COPR_WEBHOOK is not set" >&2; exit 1; }
          # Copr's script for the package builds the tag it is sent, with the spec on main.
          curl -fsS -X POST --data "$TAG" "${COPR_WEBHOOK%/}/dethumb/"
